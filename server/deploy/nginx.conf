# ─────────────────────────────────────────────────────────────
#  Nginx reverse proxy + TLS برای سامانه KPI-MS (شبکه داخلی)
#  استفاده: در docker-compose.yml سرویس nginx را از حالت کامنت خارج کنید
#  گواهی‌ها را در ./deploy/certs/ قرار دهید: server.crt و server.key
# ─────────────────────────────────────────────────────────────
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25m;          # سقف حجم آپلود (مثلاً Import اکسل)

    # آدرس سرویس برنامه در شبکه داخلی Docker
    upstream kpi_api { server api:8000; }

    # ۱) هدایت HTTP به HTTPS
    server {
        listen 80;
        server_name kpi.company.local;   # ← دامنه داخلی خود را جایگزین کنید
        return 301 https://$host$request_uri;
    }

    # ۲) سرویس اصلی روی HTTPS
    server {
        listen 443 ssl;
        server_name kpi.company.local;   # ← دامنه داخلی خود را جایگزین کنید

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # هدرهای امنیتی
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass         http://kpi_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}

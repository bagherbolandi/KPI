# استقرار داخل شبکه سازمان (On-Premise) — KPI-MS
# اجرا:  docker compose up -d --build
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kpi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kpi_secret}
      POSTGRES_DB: kpi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://kpi:${DB_PASSWORD:-kpi_secret}@db:5432/kpi
      KPI_SECRET_KEY: ${KPI_SECRET_KEY:-please-change-this-in-production}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  # اختیاری: reverse proxy با TLS برای شبکه داخلی
  # nginx:
  #   image: nginx:alpine
  #   ports: ["443:443"]
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./deploy/certs:/etc/nginx/certs:ro
  #   depends_on: [api]

volumes:
  pgdata:

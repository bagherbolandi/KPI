:root{--navy:#12315b;--primary:#2563eb;--green:#16a34a;--green-bg:#dcfce7;--yellow:#d97706;--yellow-bg:#fef3c7;
--red:#dc2626;--red-bg:#fee2e2;--gray:#64748b;--gray-bg:#f1f5f9;--bg:#f4f6fb;--card:#fff;--line:#e5e9f2;--text:#0f172a;--muted:#64748b;
--shadow:0 1px 3px rgba(16,32,60,.08);--radius:14px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Vazir',system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:14.5px;line-height:1.8}
button,input,select,textarea{font-family:inherit;font-size:inherit}a{color:var(--primary);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c7d0e0;border-radius:6px}
.app{display:flex;min-height:100vh}
.sidebar{width:256px;flex:0 0 256px;background:linear-gradient(180deg,#12315b,#0e2748);color:#e6edf7;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 12px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#60a5fa);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
.brand b{font-size:14.5px;display:block}.brand span{font-size:11px;color:#9fb3d1}
.nav{flex:1;overflow-y:auto;padding:10px}.nav a{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:10px;color:#cdd9ec;font-size:13.5px;margin-bottom:2px;cursor:pointer;transition:.13s;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}.nav a.active{background:var(--primary);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(37,99,235,.4)}
.nav a .ic{width:19px;text-align:center;font-size:15px}
.foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#9fb3d1}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
.topbar h2{margin:0;font-size:18px;color:var(--navy)}
.spacer{flex:1}
.period-filter{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
select,input,textarea{font-family:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe;color:var(--text)}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.content{padding:20px 22px 60px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card .hd h3{margin:0;font-size:15px;color:var(--navy)}
.card .bd{padding:18px}
.grid{display:grid;gap:16px}.g-4{grid-template-columns:repeat(4,1fr)}.g-3{grid-template-columns:repeat(3,1fr)}.g-2{grid-template-columns:repeat(2,1fr)}
.card.stat{position:relative;overflow:hidden;padding:18px 20px}
.card.stat .ic{position:absolute;left:16px;top:16px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px}
.card.stat .lbl{font-size:12.5px;color:var(--muted);font-weight:700}.card.stat .val{font-size:28px;font-weight:800;margin-top:6px}
.card.stat .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.card.stat.navy .val{color:var(--navy)}.card.stat.navy .ic{background:#e2e8f4;color:var(--navy)}
.card.stat.green .val{color:var(--green)}.card.stat.green .ic{background:var(--green-bg);color:var(--green)}
.card.stat.yellow .val{color:var(--yellow)}.card.stat.yellow .ic{background:var(--yellow-bg);color:var(--yellow)}
.card.stat.red .val{color:var(--red)}.card.stat.red .ic{background:var(--red-bg);color:var(--red)}
.gauge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px}
.gauge .big{font-size:32px;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge.green{background:#bbf7d0;color:#14532d}.badge.yellow{background:#fde68a;color:#713f12}
.badge.red{background:#fecaca;color:#7f1d1d}.badge.gray{background:var(--gray-bg);color:var(--gray)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}.dot.gray{background:#cbd5e1}
.chip{display:inline-block;padding:2px 9px;border-radius:7px;font-size:11px;background:var(--gray-bg);color:var(--gray);font-weight:700}
.chip.key{background:#ede9fe;color:#6d28d9}.chip.strat{background:#cffafe;color:#0e7490}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;display:inline-block;font-size:12.5px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
table.tbl th{background:#f8fafc;text-align:right;padding:11px 12px;font-size:12px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line);position:sticky;top:0;white-space:nowrap}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:hover td{background:#f8fbff}
.progress{height:8px;background:var(--gray-bg);border-radius:5px;overflow:hidden;min-width:80px}
.progress .fill{height:100%;background:var(--green);border-radius:5px}
.section-title{font-weight:800;color:var(--navy);margin:18px 0 8px;font-size:16px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.searchbox{display:flex;align-items:center;gap:6px;flex:1;min-width:180px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 10px}
.searchbox .si{opacity:.5}.searchbox input{border:0;flex:1;padding:9px 0;outline:none;background:transparent}
.btn{font-family:inherit;font-size:14px;border:0;border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{filter:brightness(.93)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{filter:brightness(.94)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{filter:brightness(.94)}
.btn-ghost{background:var(--gray-bg);color:var(--text)}.btn-ghost:hover{background:#e2e8f4}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}.btn-block{width:100%}
.act{width:120px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv span{color:var(--muted)}.kv b{text-align:left}
.note-in{background:var(--gray-bg);padding:9px 12px;border-radius:9px;font-size:12.5px;margin:6px 0}
.tip{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;font-size:13px;padding:11px 14px;border-radius:10px;margin:12px 0}
.warn{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-size:13px;padding:11px 14px;border-radius:10px;margin:12px 0}
.hint-box{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:12px;padding:11px 14px;border-radius:10px;line-height:1.9;margin-top:14px}
.form-grid{display:grid;grid-template-columns:1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}.field label{font-size:13px;color:var(--muted);font-weight:700}.field small{font-size:11.5px;color:var(--muted)}
.chart-box{position:relative;height:260px}
.modal-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:780px}.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.modal .mh h3{margin:0;font-size:17px;color:var(--navy)}.modal .x{border:0;background:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.modal .mb{padding:16px 18px}.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fff;position:sticky;bottom:0}
.tree .tnode{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:#f8fafc;border:1px solid var(--line);margin:5px 0}
.tree .tnode b{font-size:13.5px}.tree .spacer{flex:1}.tree .tnode a{color:var(--primary);cursor:pointer;font-size:12px}
.tree .lvl-co{background:#eef2ff;border-color:#c7d2fe}.tree .lvl-pr{margin-right:18px;background:#f0fdf4;border-color:#bbf7d0}.tree .tchildren{margin-right:34px}
.tree .lvl-k{margin:3px 0;padding:5px 10px;background:#fff;border:1px solid var(--line);border-radius:7px;font-size:12.5px}
.persist-warn{background:#fef3c7;color:#92400e;border-bottom:1px solid #fde68a;padding:9px 16px;font-size:12.5px;text-align:center}
.badge-n{margin-inline-start:auto;background:#f59e0b;color:#fff;font-size:10.5px;border-radius:9px;padding:1px 7px;font-weight:700}
.chip.wf-draft{background:#e2e8f0;color:#475569}.chip.wf-reviewed{background:#fef3c7;color:#b45309}.chip.wf-approved{background:#dcfce7;color:#15803d}
.empty{padding:34px;text-align:center;color:var(--muted);background:var(--gray-bg);border-radius:12px;font-size:14px}
.printable{display:none}
@media print{@page{size:A4;margin:12mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}html,body{background:#fff!important}body>*:not(#print-root){display:none!important}#print-root.printable{display:block!important;position:static}#print-root thead{display:table-header-group}#print-root tr{page-break-inside:avoid}#print-root h3{page-break-after:avoid}}
.chip.nd-none,.chip.nd-part{background:#e2e8f0;color:#334155}
@media (max-width:900px){.app{flex-direction:column}.sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap}.brand{border-bottom:0;padding:10px 12px}.nav{flex-direction:row;overflow-x:auto;padding:6px;flex:1}.nav a{white-space:nowrap;padding:8px 12px}.foot{display:none}.g-4,.g-3,.g-2{grid-template-columns:1fr}.content{padding:14px}.topbar{flex-wrap:wrap;gap:8px;padding:10px 14px}.topbar h2{font-size:17px}}
.grid.g-4:has(>:nth-child(5)){grid-template-columns:repeat(5,1fr)}.card.stat.blue .val{color:var(--primary)}.card.stat.blue .ic{background:#dbeafe;color:var(--primary)}@media (max-width:900px){.grid.g-4:has(>:nth-child(5)){grid-template-columns:1fr}}
</style>

  <aside class="sidebar">
    <div class="brand"><div class="logo">K</div><div><b id="brandName">سامانه KPI</b><span>مدیریت عملکرد</span></div></div>
    <div id="nav" class="nav"></div>
    <div class="foot">نسخه تک‌کاربر ۱٫۰ · آفلاین</div>

    <header class="topbar">
      <div><h2 id="topTitle">داشبورد مدیریتی</h2></div>
      <div class="spacer"></div>

    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="modal-root"></div>

    var a = +actual, t = +target, r;

    } else {

    }

    return Math.round(r * 10000) / 10000;
  }

     - اگر عملکرد به هدف رسیده/بهتر باشد => مطلوب (سبز)
     - اگر بین هدف و حد هشدار باشد => نیازمند توجه (زرد)
     - اگر از حد هشدار عبور کرده باشد (بدتر از آن) => بحرانی (قرمز)
     در صورتی که حد هشدار برای شاخص تعریف نشده یا با هدف برابر باشد، به‌صورت ایمن به روش قبلی

  }

  function analysisRange(raw) {

    if(r.ty-r.fy>=20) return {error:"حداکثر دامنه قابل انتخاب ۲۰ سال است."};
    if([0.01,0.05,0.1].indexOf(r.alpha)<0 || ["welch","paired"].indexOf(r.method)<0) return {error:"روش آزمون یا سطح معناداری معتبر نیست."};

  function analysisPoints(k,r) {

  function analysisMoments(values) {

  function analysisCritical(alpha,df) {

  function analysisCompare(a,b,method,alpha) {
    var av=a.map(function(p){return p.y;}),bv=b.map(function(p){return p.y;}),diffs=[];
    if(method==="paired") {
      var bm={};b.forEach(function(p){bm[p.month]=p.y;});av=[];bv=[];
      a.forEach(function(p){if(Object.prototype.hasOwnProperty.call(bm,p.month)){av.push(p.y);bv.push(bm[p.month]);diffs.push(bm[p.month]-p.y);}});
    }

  function strategyMgtComplete(k,year,month){

  function strategyMeasure(g,l,asof){
    var k=kpiById(l.kpiId),out={link:l,k:k,actual:null,period:null,progress:null,expected:Math.max(0,Math.min(1,(asof-g.start+1)/(g.end-g.start+1))),status:'missing',reason:'داده معتبر در دامنه هدف ثبت نشده است.'};
    if(l.mode==='maintain')out.expected=asof<g.start?0:1;
    if(!k||k.company_id!==g.company_id||!isActive(k)){out.status='invalid';out.reason='شاخص حذف یا غیرفعال شده است؛ اتصال بازنگری شود.';return out;}
    if(strategyFingerprint(k)!==l.fingerprint){out.status='invalid';out.reason='تعریف، واحد، جهت یا تناوب شاخص تغییر کرده؛ اتصال و خط مبنا بازنگری شود.';return out;}

      due=n;var e=getEntryR(k.id,year,month),v=isMgtKpi(k)?trendNumber(getEffectiveActual(k,year,month)):(e?trendNumber(e.actual):null);
      if(v!==null){out.actual=v;out.period=n;}
    }
    if(out.actual===null){if(due===null){out.status='future';out.reason='هنوز دوره پایش این شاخص سررسید نشده است.';}return out;}
    out.progress=l.mode==='maintain'?(k.direction==='down'?(out.actual<=l.target?1:0):(out.actual>=l.target?1:0)):Math.max(0,Math.min(1,(out.actual-l.baseline)/(l.target-l.baseline)));

    var eventDriven=['event','per_ecn'].indexOf(k.frequency)>=0;
    if(isMgtKpi(k)&&!strategyMgtComplete(k,Math.floor(out.period/12),out.period%12+1)){out.status='stale';out.reason='مقدار خودکار محاسبه شده، اما داده دوره‌های سررسیدشده شاخص‌های پایه کامل نیست.';}
    else if(!eventDriven&&out.period<due){out.status='stale';out.reason='آخرین ثبت قدیمی است؛ دوره پایش جدید فاقد داده معتبر است.';}

  }
  function strategyEvaluate(g,asof){

    var progress=weight?sum/weight:null,expected=weight?rows.reduce(function(total,r){return total+r.expected*r.link.weight;},0)/weight:Math.max(0,Math.min(1,(asof-g.start+1)/(g.end-g.start+1)));

  function strategyTrigger(g,a,asof){

      var f = k.frequency || "monthly", got = has[k.id] || {};
      if (f === "per_ecn" || f === "event") {
        considered++;
        if (!Object.keys(got).length) rows.push({ k: k, kind: "none", expected: null, got: 0, missing: [] });

      if (!due.length) return;

        if (!ok) missing.push(periodLabel(k, p, multi));
      });
      if (missing.length) rows.push({ k: k, kind: missing.length === due.length ? "none" : "partial", expected: due.length, got: due.length - missing.length, missing: missing });
    });
    if (opts.kind === "none" || opts.kind === "partial") rows = rows.filter(function (r) { return r.kind === opts.kind; });
    rows.sort(function (a, b) {
      return ((a.kind === "none" ? 0 : 1) - (b.kind === "none" ? 0 : 1)) || (a.k.processCode < b.k.processCode ? -1 : a.k.processCode > b.k.processCode ? 1 : 0) || (a.k.code < b.k.code ? -1 : 1);
    });

    return { rows: rows, none: none, partial: rows.length - none, considered: considered };
  }
  function ndChip(r) { return r.kind === "none" ? '<span class="chip nd-none">بدون داده</span>' : '<span class="chip nd-part">ناقص (' + fa(r.got) + " از " + fa(r.expected) + ")</span>"; }
  function ndMissingText(r) { if (r.expected === null) return "هیچ مقداری ثبت نشده"; if (r.kind === "none" && r.missing.length >= 3) return "همه دوره‌ها: " + esc(r.missing[0]) + " تا " + esc(r.missing[r.missing.length - 1]); return r.missing.map(esc).join("، "); }
  function noDataScreenHTML(nd) {

  }

  /* ---------------- ساخت گزارش چاپی (مشترک) ---------------- */
  var PC = { green: ["#bbf7d0", "#14532d"], yellow: ["#fde68a", "#713f12"], red: ["#fecaca", "#7f1d1d"], gray: ["#e2e8f0", "#334155"] };
  function pcs(c) { var o = PC[c || "gray"] || PC.gray; return "background:" + o[0] + ";color:" + o[1] + ";font-weight:700"; }
  function achColor(a) { return a === null || a === undefined ? "gray" : a >= S.thGreen ? "green" : a >= S.thYellow ? "yellow" : "red"; }
  function pLegend() { return '<p style="font-size:11px;margin:6px 0;text-align:center">' + ["green", "yellow", "red", "gray"].map(function (c) { return '<span style="' + pcs(c) + ';padding:2px 9px;border-radius:10px;margin:0 3px">' + ({ green: "مطلوب", yellow: "نیازمند توجه", red: "بحرانی", gray: "بدون داده" })[c] + "</span>"; }).join("") + "</p>"; }
  var PREPARED_BY = "تهیه شده در واحد تضمین کیفیت نور ایستا پلاستیک (NIPCO)";
  function avgActYear(k, year) {
    var cid = currentCompanyId(), sum = 0, n = 0;
    S.entries.forEach(function (e) { if (e.kpiId === k.id && +e.year === +year && e.company_id === cid && entryOk(e) && isNumVal(e.actual)) { sum += +toEn(e.actual); n++; } });
    return n ? sum / n : null;
  }
  function fmtAvg(v, k) { return v === null || v === undefined ? "—" : fmt(Math.round(v * 100) / 100) + (k && k.uom === "percent" ? "٪" : ""); }
  function nw(x) { return '<span style="white-space:nowrap">' + x + "</span>"; }
  function pTd(h, center, st) { return '<td style="border:1px solid #cbd5e1;padding:5px 6px' + (center ? ";text-align:center" : "") + (st ? ";" + st : "") + '">' + h + "</td>"; }
  function pTable(heads, rows) {
    var th = "border:1px solid #cbd5e1;padding:5px 6px;background:#f1f5f9;font-size:11.5px";
    return '<table style="width:100%;border-collapse:collapse;font-size:11.5px"><thead><tr>' + heads.map(function (h) { var c = h.charAt(0) === "@" ? h.split("|") : null; return c ? '<th style="' + th + ";" + pcs(c[0].slice(1)) + '">' + c[1] + "</th>" : '<th style="' + th + '">' + h + "</th>"; }).join("") + "</tr></thead><tbody>" + rows.join("") + "</tbody></table>";
  }
  function pSum(items) {
    return '<table style="width:100%;border-collapse:collapse;margin:10px 0"><tr>' + items.map(function (x) {
      var c = x[2] || "", o = PC[c] || null; return '<td style="border:1px solid #cbd5e1;padding:7px;text-align:center' + (o ? ";background:" + o[0] : "") + '"><div style="font-size:11px;color:' + (o ? o[1] : "#475569") + '">' + x[0] + '</div><div style="font-weight:800;font-size:16px;color:' + (o ? o[1] : "#0f172a") + '">' + x[1] + "</div></td>";
    }).join("") + "</tr></table>";
  }
  function pHead(t) { return '<h3 style="color:#12315b;margin:16px 0 6px;font-size:14px">' + t + "</h3>"; }
  function pWrap(title, meta, body, hideLegend) { body = (hideLegend ? "" : pLegend()) + body + '<p style="margin-top:18px;padding-top:8px;border-top:1px solid #cbd5e1;text-align:center;color:#475569;font-size:11.5px;font-weight:700">' + PREPARED_BY + "</p>"; return '<div style="font-family:Vazir,Tahoma;direction:rtl;color:#0f172a"><h2 style="text-align:center;color:#12315b;margin:0 0 4px;font-size:18px">' + title + '</h2><p style="text-align:center;color:#475569;font-size:11.5px;margin:0 0 6px">' + meta + "</p>" + body + "</div>"; }
  function doPrint(html) { document.getElementById("print-root").innerHTML = html; window.print(); }
  function dateFa() { return new Date().toLocaleDateString("fa-IR"); }
  function impText(v) { return v === "strategic" ? "شاخص‌های استراتژیک" : v === "key" ? "شاخص‌های کلیدی" : v === "operational" ? "شاخص‌های عادی" : "همه سطوح"; }
  function noDataPrintHTML(nd) {
    if (!nd.rows.length) return '<p style="font-size:12px;color:#15803d;background:#dcfce7;padding:6px;border-radius:6px">همه شاخص‌های دارای سررسید، در دوره‌های تناوب پایش مقدار عددی ثبت‌شده دارند.</p>';
    return pTable(["کد", "نام شاخص", "فرایند", "تناوب پایش", "وضعیت ثبت", "دوره‌های بدون ثبت"], nd.rows.map(function (r) {

        pTd(r.kind === "none" ? "بدون داده" : "ناقص (" + fa(r.got) + " از " + fa(r.expected) + ")", 1, pcs("gray")) + pTd(ndMissingText(r)) + "</tr>";
    }));
  }
  function ndSummaryItems(nd) { return [["شاخص‌های دارای سررسید", fa(nd.considered)], ["بدون هیچ داده", fa(nd.none), "gray"], ["ناقص", fa(nd.partial), "gray"]]; }

  /* متن نمایشی هدف و معیار پذیرش + انتخاب فهرست شاخص‌ها (مشترک بین چاپ و دانلود) */
  function kpiLimitText(k, value) {
    if (!isNumVal(value)) return "تعریف نشده";
    return (k.direction === "down" ? "حداکثر " : "حداقل ") + fmt(value) + " " + uomLabel(k.uom);
  }
  function kpiTargetText(k) {
    var tt = String(k.target_text == null ? "" : k.target_text).trim();
    var numeric = kpiLimitText(k, k.target);
    if (!tt) return numeric;
    if (/[^\d\s\.\,\/\-]/.test(tt)) {
      var numOnly = tt.replace(/[^\d\.\-]/g, "");
      if (numOnly !== "" && isNumVal(k.target) && tt.length < 12) {
        try { if (Math.abs(parseFloat(numOnly) - (+k.target)) < 1e-9) return numeric; } catch(e) {}
      }
      return tt;
    }
    return numeric;
  }
  function kpiAcceptanceText(k) {
    var acceptance = String(k.acceptance_text == null ? "" : k.acceptance_text).trim();
    if (!acceptance) acceptance = isNumVal(k.warning) ? kpiLimitText(k, k.warning) + " (بر اساس حد هشدار)" : "تعریف نشده";
    return acceptance;
  }
  function kpiListByMode(mode, actionWord) {
    mode = mode || "active";
    if (mode !== "active" && mode !== "all" && mode !== "inactive") mode = "active";
    actionWord = actionWord || "چاپ";
    if (!isLoggedIn() || !(can("kpis") || can("master") || can("reports"))) { alert("دسترسی به " + actionWord + " شاخص‌ها مجاز نیست."); return null; }
    var cid = currentCompanyId(), cu = getCurrentUser();
    if (!canAccessCompany(cid)) { alert("دسترسی به این شرکت مجاز نیست."); return null; }
    var ownProcess = cu.role_code === "process_owner";
    var base = S.kpis.filter(function(k) {
      return k.company_id === cid && (!ownProcess || (!!cu.processCode && k.processCode === cu.processCode));
    });
    var list = base.filter(function(k) {
      if (mode === "all") return true;
      if (mode === "inactive") return !isActive(k);
      return isActive(k);
    }).sort(function(a, b) {
      return String(a.processName || "").localeCompare(String(b.processName || ""), "fa") || String(a.code || "").localeCompare(String(b.code || ""), "fa", {numeric:true});
    });

      return null;
    }
    return { mode: mode, list: list, base: base, ownProcess: ownProcess, cu: cu, cid: cid };
  }

  /* چاپ فهرست شاخص‌ها (فعال / کل / غیرفعال) همراه با هدف و معیار پذیرش */

    function textCell(v) { return '<span style="white-space:pre-wrap;overflow-wrap:anywhere">' + esc(v) + '</span>'; }

    var nInactive = base.length - nActive;

    var descs = {
      active: "این فهرست شامل همه شاخص‌های فعال در محدوده دسترسی است و به فیلترهای جستجو و دوره عملکرد وابسته نیست.",
      all: "این فهرست شامل همه شاخص‌ها (فعال و غیرفعال) در محدوده دسترسی است و به فیلترهای جستجو و دوره عملکرد وابسته نیست.",

  }

  /* دانلود فهرست شاخص‌ها (فعال / کل / غیرفعال) در قالب Excel یا CSV همراه با هدف و معیار پذیرش */

  /* گزارش مدیریتی سالانه (PDF) */

    var meta = "دوره: فروردین تا " + MONTHS[yr.lastMonth - 1] + " " + fa(year) + " · وضعیت بر پایه آخرین مقدار ثبت‌شده · داده: " + dataNote() + " · " + dateFa();
    var body = pSum([["کل شاخص‌ها", fa(ov.total)], ["میانگین تحقق وزنی", pct(ov.weighted)], ["مطلوب", fa(cc.green), "green"], ["نیازمند توجه", fa(cc.yellow), "yellow"], ["بحرانی", fa(cc.red), "red"], ["بدون داده / ناقص", fa(nd.none) + " / " + fa(nd.partial), "gray"]]);

  /* گزارش مجزای شاخص‌های فاقد داده */

  /* ---------------- jalali helpers for range report ---------------- */
  function parseJalaliDate(str){
    if(!str) return null;
    var s=toEn(String(str)).trim().replace(/[-]/g,"/").replace(/\s+/g,"");
    var parts=s.split("/"); if(parts.length!==3) return null;
    var y=+parts[0], m=+parts[1], d=+parts[2];
    if(!y||!m||!d||m<1||m>12||d<1||d>31) return null;
    return {y:y,m:m,d:d, num: y*10000 + m*100 + d };
  }
  function isMgtKpi(k){ return k && k.processCode==="MGT"; }
  function getMgtDerivedActual(year, month){
    // میانگین لحظه‌ای از ابتدای سال تا ماه جاری (برای شاخص سالانه MGT)
    var cid=currentCompanyId();
    var sum=0, n=0;
    S.kpis.forEach(function(k){
      if(k.company_id!==cid || !isActive(k) || isMgtKpi(k)) return;
      for(var m=1; m<=month; m++){
        var e=getEntryR(k.id, year, m);
        if(!e || e.actual===null || e.actual==="") continue;
        var ach=achievement(e.actual, k.target, k.direction);
        if(ach!==null){ sum+=ach; n++; }
      }
    });
    if(n===0) return null;
    return Math.round((sum/n)*10000)/100;
  }
  function getMgtAnnualAverage(year){
    var cid=currentCompanyId();
    var sum=0, n=0;
    S.kpis.forEach(function(k){
      if(k.company_id!==cid || !isActive(k) || isMgtKpi(k)) return;
      for(var m=1; m<=12; m++){
        var e=getEntryR(k.id, year, m);
        if(!e || e.actual===null || e.actual==="") continue;
        var ach=achievement(e.actual, k.target, k.direction);
        if(ach!==null){ sum+=ach; n++; }
      }
    });
    if(n===0) return null;
    return Math.round((sum/n)*10000)/100;
  }
  function getEffectiveActual(k, year, month){
    if(isMgtKpi(k)){
      return getMgtDerivedActual(year, month);
    }
    var e=getEntryR(k.id, year, month);
    return e? e.actual : null;
  }
  function getEffectiveAch(k, year, month){
    var act=getEffectiveActual(k, year, month);
    if(act===null || act==="") return null;
    return achievement(act, k.target, k.direction);
  }
  /* process title edit */
  function renameProcess(oldCode, newCode, newName){
    if(newCode===undefined){ // backward compat: renameProcess(code,newName)
      newName=newCode; newCode=oldCode;
    }
    newCode=(newCode||"").trim().toUpperCase();
    newName=(newName||"").trim();
    if(!newCode){ alert("شناسه اختصاری نمی‌تواند خالی باشد"); return false; }
    if(!/^[A-Z0-9_]{2,10}$/.test(newCode)){ alert("شناسه باید 2 تا 10 کاراکتر انگلیسی بزرگ، عدد یا _ باشد"); return false; }
    if(!newName){ alert("نام فرایند نمی‌تواند خالی باشد"); return false; }
    if(newCode!==oldCode && S.kpis.some(function(k){ return k.processCode===newCode; })){ alert("این شناسه قبلا استفاده شده است"); return false; }
    var cnt=0;
    S.kpis.forEach(function(k){ if(k.processCode===oldCode){ k.processCode=newCode; k.processName=newName; k.divisionCode=newCode; cnt++; } });
    S.users.forEach(function(u){ if(u.processCode===oldCode) u.processCode=newCode; });
    if(S._filterProc===oldCode) S._filterProc=newCode;
    if(cnt===0){ alert("فرایندی یافت نشد"); return false; }
    save(); render();
    return true;
  }

  /* frequency helpers */
  function isEntryDue(k, month){
    var f=k.frequency||"monthly";
    if(f==="monthly") return true;
    if(f==="quarterly") return month%3===0;
    if(f==="semiannual") return month%6===0;
    if(f==="annual") return month===12;
    if(f==="per_ecn") return true;
    return true;
  }
  function periodHint(k){
    var f=k.frequency||"monthly";
    if(f==="quarterly") return "فصلی (پایان هر فصل)";
    if(f==="semiannual") return "شش‌ماهه (شهریور/اسفند)";
    if(f==="annual") return "سالانه (اسفند)";
    if(f==="per_ecn") return "به‌ازای هر ECN";
    return "ماهانه";
  }
  function entryInRange(e, fromNum, toNum){
    var d = e.day || 1;
    var num = e.year*10000 + e.month*100 + d;
    return num>=fromNum && num<=toNum;
  }
  function parseRange(fromStr, toStr){
    var f=parseJalaliDate(fromStr), tt=parseJalaliDate(toStr);
    if(!f||!tt) return null;
    var a=f.num, b=tt.num; if(a>b){ var t=a; a=b; b=t; }
    return {fromNum:a, toNum:b};
  }
  function getRangeEntries(fromStr, toStr){
    var f=parseJalaliDate(fromStr), tt=parseJalaliDate(toStr);
    if(!f||!tt) return null;
    var fromNum=f.num, toNum=tt.num;
    if(fromNum>toNum){ var tmp=fromNum; fromNum=toNum; toNum=tmp; }
    var cid=currentCompanyId();
    return S.entries.filter(function(e){ return e.company_id===cid && entryOk(e) && entryInRange(e, fromNum, toNum); });
  }
  function aggregateRange(entries, range, basis){
    var cid=currentCompanyId(); basis = basis==="last" ? "last" : "avg";
    var byKpi={};
    entries.forEach(function(e){
      var k=kpiById(e.kpiId); if(!k||k.company_id!==cid||!isActive(k)||isMgtKpi(k)) return;
      if(e.actual===null||e.actual===undefined||e.actual==="") return;
      var a=+toEn(e.actual); if(isNaN(a)) return;
      (byKpi[k.id]=byKpi[k.id]||{k:k,pts:[]}).pts.push({t:e.year*10000+e.month*100+(e.day||1), a:a});
    });
    if(range){
      var fy=Math.floor(range.fromNum/10000), fm=Math.floor((range.fromNum%10000)/100), ty=Math.floor(range.toNum/10000), tm=Math.floor((range.toNum%10000)/100);
      S.kpis.forEach(function(k){
        if(k.company_id!==cid||!isActive(k)||!isMgtKpi(k)) return;
        var y=fy, m=fm, it=0, pts=[];
        while((y<ty||(y===ty&&m<=tm)) && it<60){ var act=getMgtDerivedActual(y,m); if(act!==null) pts.push({t:y*10000+m*100+1,a:act}); m++; if(m>12){m=1;y++;} it++; }
        if(pts.length) byKpi[k.id]={k:k,pts:pts};
      });
    }
    var rows=Object.keys(byKpi).map(function(id){
      var v=byKpi[id]; v.pts.sort(function(x,y){return x.t-y.t;});
      var vals=v.pts.map(function(p){return p.a;});
      var avgAct=vals.reduce(function(s,x){return s+x;},0)/vals.length;
      var last=vals[vals.length-1];
      var achs=vals.map(function(x){return achievement(x, v.k.target, v.k.direction);}).filter(function(x){return x!==null;});
      var basisVal = basis==="last" ? last : avgAct;
      var avgAch = basis==="last" ? achievement(last, v.k.target, v.k.direction) : (achs.length ? achs.reduce(function(s,x){return s+x;},0)/achs.length : null);
      return {k:v.k, count:vals.length, avgActual:avgAct, last:last, avgAch:avgAch, status:statusByTargetWarning(basisVal, v.k.target, v.k.warning, v.k.direction)};
    }).sort(function(a,b){ return ((a.avgAch===null)-(b.avgAch===null)) || ((a.avgAch||0)-(b.avgAch||0)); });
    return {rows:rows};
  }

  function runRangeReport(){
    var from=(document.getElementById("repFrom")||{}).value||"";
    var to=(document.getElementById("repTo")||{}).value||"";
    var proc=(document.getElementById("repProc")||{}).value||"";
    var stF=(document.getElementById("repStatus")||{}).value||"";
    var impF=(document.getElementById("repImp")||{}).value||"";
    var basis=(document.getElementById("repBasis")||{}).value||"avg";
    var entries=getRangeEntries(from,to);
    var box=document.getElementById("rangeResult");
    if(entries===null){ box.innerHTML='<div class="warn">فرمت تاریخ نادرست است. مثال صحیح: 1404/05/01</div>'; return; }
    var aggAll=aggregateRange(entries, parseRange(from,to), basis);
    // filter rows by selected criteria first
    var rowsAll=aggAll.rows.filter(function(r){
      if(proc && r.k.processCode!==proc) return false;
      if(impF==="strategic" && !r.k.is_strategic) return false;
      if(impF==="key" && r.k.importance!=="key") return false;
      if(impF==="operational" && r.k.importance!=="operational") return false;
      return true;
    });
    // recompute stats only for filtered rows (+ status filter)
    var rows=rowsAll.filter(function(r){ if(stF && r.status!==stF) return false; return true; });
    // compute filtered aggregate
    var fTotal=rows.length, fSum=0, fWsum=0, fWsumAch=0, fGreen=0, fYellow=0, fRed=0, fNodata=0;
    rows.forEach(function(r){
      if(r.avgAch!==null){ fSum+=r.avgAch; fWsum+=(r.k.weight||1); fWsumAch+=r.avgAch*(r.k.weight||1); }
      if(r.status==="green") fGreen++; else if(r.status==="yellow") fYellow++; else if(r.status==="red") fRed++; else fNodata++;
    });
    var fAvg = fTotal? (fSum / rows.filter(function(r){return r.avgAch!==null}).length || 0) : 0;
    var fWeighted = fWsum? fWsumAch/fWsum : 0;
    var agg={avg:fAvg, weighted:fWeighted, counts:{green:fGreen, yellow:fYellow, red:fRed, nodata:fNodata, total:fTotal}};
    var nd = stF ? null : noDataAnalysis(parseRange(from,to), {proc:proc, imp:impF});
    // save for export
    
    var html='<div class="hint-box" style="background:#f0fdf4;border-color:#bbf7d0;color:#14532d">گزارش '+(impF==="strategic"?"شاخص‌های استراتژیک":impF==="key"?"شاخص‌های کلیدی":impF==="operational"?"شاخص‌های عملیاتی/عادی":"همه شاخص‌ها")+' در بازه '+esc(from)+' تا '+esc(to)+(proc?" - فرایند: "+esc(proc):"")+' · مبنای ارزیابی: '+(basis==="last"?"آخرین مقدار":"میانگین دوره")+' · داده: '+dataNote()+'</div>';
    html+='<div class="grid g-4" style="margin-top:12px">'+stat("تعداد شاخص در گزارش", fa(fTotal), "از "+fa(aggAll.rows.length)+" شاخص دارای داده در بازه", "navy", "📊")+stat("میانگین تحقق وزنی", pct(fWeighted), "میانگین ساده: "+pct(fAvg), fWeighted>=S.thGreen?"green":fWeighted>=S.thYellow?"yellow":"red", "🎯")+stat("مطلوب", fa(fGreen), pct(fTotal? fGreen/fTotal:0), "green", "✅")+stat("بحرانی", fa(fRed), fa(fYellow)+" نیازمند توجه", "red", "⚠️")+(nd?stat("فاقد داده", fa(nd.rows.length), fa(nd.none)+" بدون داده · "+fa(nd.partial)+" ناقص", nd.rows.length?"yellow":"green", "📭"):"")+'</div>';
    html+='<div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>کد</th><th>نام شاخص</th><th>فرایند</th><th>تعداد ثبت</th><th>میانگین عملکرد</th><th>آخرین مقدار</th><th>تحقق (طبق مبنا)</th><th>وضعیت بازه</th><th>روند</th></tr></thead><tbody>';
    rows.forEach(function(r){
      html+="<tr><td class='mono'>"+esc(r.k.code)+"</td><td>"+esc(r.k.name)+"</td><td>"+esc(r.k.processName)+"</td><td>"+fa(r.count)+"</td><td>"+fmt(r.avgActual!==null&&r.avgActual!==undefined? Math.round(r.avgActual*100)/100 : null)+"</td><td>"+fmt(r.last!==null&&r.last!==undefined? Math.round(r.last*100)/100 : null)+"</td><td>"+(r.avgAch!==null? pct(r.avgAch):"—")+"</td><td>"+(r.status? badge(r.status):"—")+"</td><td><a onclick=\"KPI.openDetail('"+r.k.id+"')\">روند ›</a></td></tr>";
    });
    html+="</tbody></table></div>";
    if(!rows.length) html+='<div class="empty" style="margin-top:8px">در بازه و فیلترهای انتخابی، شاخصی با داده ثبت‌شده وجود ندارد.</div>';
    if(nd) html+='<div class="section-title">📭 شاخص‌های فاقد داده ('+fa(nd.rows.length)+')</div>'+noDataScreenHTML(nd);
    window._lastRange={from:from,to:to,rows:rows, entries:entries, agg:agg, basis:basis, nd:nd};
    box.innerHTML=html;
  }

    var csv="\uFEFF"+rows.map(function(rr){ return rr.map(function(c){ var s=String(c==null?"":c).replace(/"/g,'""'); if(s.indexOf(";")>=0 || s.indexOf("\n")>=0 || s.indexOf('"')>=0) s='"'+s+'"'; return s; }).join(";"); }).join("\n");
    download(csv, "KPI_Range_"+lr.from.replace(/\//g,"-")+"_to_"+lr.to.replace(/\//g,"-")+".csv", "application/vnd.ms-excel;charset=utf-8;");

  async function validateNewPw(idA, idB){

    if(await isDefaultPw(a)) return {err:"این رمز مجاز نیست؛ یک رمز جدید انتخاب کنید"};
    return {pw:a};
  }

  async function attemptLogin(){
    var u=(document.getElementById("lg_user")||{}).value||""; var p=(document.getElementById("lg_pass")||{}).value||"";
    u=toEn(u).trim(); p=toEn(p); // تبدیل اعداد فارسی/عربی احتمالی (مثلاً در کیبورد فارسی) به انگلیسی تا با رمز عبور مطابقت داده شود
    if(!u || !p){ renderLogin("نام کاربری و رمز عبور الزامی است"); return; }

  async function saveUser(uid){
    var isNew = !uid;
    var username = (document.getElementById("uf_user")||{}).value||""; username=username.trim();
    var full = (document.getElementById("uf_name")||{}).value||""; full=full.trim();
    var pass = toEn((document.getElementById("uf_pass")||{}).value||"");
    var role = (document.getElementById("uf_role")||{}).value||"process_owner";
    var compId = +((document.getElementById("uf_company")||{}).value||currentCompanyId());
    var proc = (document.getElementById("uf_proc")||{}).value||"";
    var active = ((document.getElementById("uf_active")||{}).value||"1")==="1";
    var perms = window._tmpPerms || null;
    // validate holding only admin
    if(perms && perms.indexOf("holding")>=0 && role!=="admin"){
      alert("فقط نقش admin به داشبورد هلدینگ دسترسی دارد"); return;
    }
    // only admin can grant admin pages
    var adminPages=["users","companies","settings","master","audit"];
    if(perms && perms.some(function(p){return adminPages.indexOf(p)>=0;})){
      var cur=getCurrentUser();
      if(!cur || cur.role_code!=="admin"){
        alert("فقط مدیر سیستم می‌تواند دسترسی مدیریتی بدهد"); return;
      }
    }
    if(!username){ alert("نام کاربری الزامی است"); return; }
    if(!/^[a-zA-Z0-9_.-]{3,30}$/.test(username)){ alert("نام کاربری باید ۳ تا ۳۰ کاراکتر انگلیسی/عدد/ _ . - باشد"); return; }
    if(isNew && !pass){ alert("رمز عبور برای کاربر جدید الزامی است"); return; }
    if(pass){ var _pw=pwWeak(pass); if(_pw){ alert(_pw); return; } }
    if(!perms || !perms.length){
      perms = ROLE_PERMS[role] ? ROLE_PERMS[role].slice() : [];
    }
    // hash helper inline sync
    async function _hashForSave(pwd){ var s=genSalt(); return {hash: await hashSecure(pwd, s), salt:s}; }
    if(isNew){
      for(var i=0;i<S.users.length;i++) if(S.users[i].username===username){ alert("این نام کاربری قبلاً وجود دارد"); return; }
      var _hs=await _hashForSave(pass);
      var nu={id:S.nextUserId++, username:username, passwordHash: _hs.hash, salt: _hs.salt, full_name: full||username, role_code: role, company_id: compId, processCode: proc, is_active: active, permissions: perms};
      S.users.push(nu);
      // try async upgrade
      (async function(){ try{ var nh=await hashPassword(pass, _hs.salt); nu.passwordHash=nh; save(); }catch(e){} })();
    } else {
      var u=null; for(var j=0;j<S.users.length;j++) if(S.users[j].id===uid){ u=S.users[j]; break; }
      if(!u) return;
      if(u.username==="admin" && role!=="admin"){ alert("نقش کاربر admin قابل تغییر نیست"); return; }
      if(pass){ var _hs2=await _hashForSave(pass); u.passwordHash=_hs2.hash; u.salt=_hs2.salt; delete u.password; (async function(){ try{ var nh2=await hashPassword(pass, _hs2.salt); u.passwordHash=nh2; save(); }catch(e){} })(); }
      u.full_name = full||u.username; u.role_code = role; u.company_id=compId; u.processCode = proc; u.is_active = active; u.permissions = perms;
    }
    save(); closeModal(); renderUsers();
  }

  function holdingAggregate(){
    var out=[];
    S.companies.forEach(function(comp){
      var ckpis=S.kpis.filter(function(k){return k.company_id===comp.id && isActive(k);});
      var year=S.currentYear; var wsum=0, wsumAch=0; var counts={green:0,yellow:0,red:0,nodata:0};
      ckpis.forEach(function(k){
        var mgt = isMgtKpi(k);
        var actVal = mgt ? getEffectiveActual(k, year, 12) : null;
        var e = mgt ? (actVal!==null ? {actual:actVal} : null) : latestEntry(k.id, year);
        if(!mgt) actVal = e ? e.actual : null;
        var ach = e ? achievement(actVal, k.target, k.direction) : null;
        var st = e ? statusByTargetWarning(actVal, k.target, k.warning, k.direction) : null;
        if(st) counts[st]++; else counts.nodata++;
        if(!mgt && e && ach!==null){ var w=(+k.weight||1); wsumAch += ach*w; wsum += w; }
      });
      var avg = wsum? wsumAch/wsum : 0;
      out.push({id:comp.id, code:comp.code, name:comp.name, color:comp.color, total:ckpis.length, counts:counts, avg:avg, meas:wsum>0});
    });
    out.sort(function(a,b){return (b.meas-a.meas)||(b.avg - a.avg);});
    return out;
  }

    // company selector in topbar
    var canSwitch = getCurrentUser() && (getCurrentUser().role_code==="admin" || getEffectivePerms(getCurrentUser()).indexOf("holding")>=0);
    var compSel = canSwitch
      ? '<select onchange="KPI.setCurrentCompany(this.value)" style="margin:0 8px;padding:6px 10px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:13px">'
        + S.companies.map(function(c){ return '<option value="'+c.id+'"'+(c.id===currentCompanyId()?' selected':'')+'>'+esc(c.name)+' ('+esc(c.code)+')</option>'; }).join("") + '</select>'
      : '<span class="chip" style="background:#eef2ff;color:#12315b;margin:0 8px">'+esc(comp.name)+' ('+esc(comp.code)+')</span>';
    document.getElementById("yearBar").innerHTML = compSel + yearSelect() + ' <label class="chip" style="cursor:pointer;margin:0 6px;background:' + (S.onlyApproved ? "#dcfce7;color:#15803d" : "#f1f5f9;color:#64748b") + '"><input type="checkbox" style="margin-left:4px;vertical-align:middle" ' + (S.onlyApproved ? "checked" : "") + ' onchange="KPI.setOnlyApproved(this.checked)">فقط تأییدشده</label>' + ' <span class="chip" style="background:'+comp.color+';color:#fff">'+esc(comp.code)+'</span>';
    var titles={ strategy: "اهداف استراتژیک و برنامه‌های اقدام", dashboard: "داشبورد شرکت — "+comp.name, holding: "داشبورد هلدینگ — مقایسه "+fa(S.companies.length)+" شرکت", processes: "فرایندها — "+comp.name, kpis: "شاخص‌ها و روندها", entry: "ثبت عملکرد — "+comp.name, inbox: "کارتابل تأیید", master: "مدیریت شاخص‌ها — "+comp.name, org: "ساختار سازمانی — "+comp.name, reports: "گزارش‌ها و خروجی", settings: "تنظیمات سامانه", users: "کاربران و دسترسی‌ها", companies: "شرکت‌های هلدینگ (۸ شرکت)" };
    document.getElementById("topTitle").innerHTML = esc(titles[S.view]||"") + ' <span class="chip" style="vertical-align:middle;background:#eef2ff;color:#12315b">'+esc(roleLabel(cu.role_code))+'</span>';
    if (S.view === "dashboard") renderDashboard();
    else if (S.view === "holding") renderHolding();
    else if (S.view === "processes") renderProcesses();
    else if (S.view === "kpis") renderKpis();
    else if (S.view === "strategy") renderStrategy();
    else if (S.view === "entry") { if(can("entry")) renderEntry(); else document.getElementById("view").innerHTML='<div class="warn">⛔ دسترسی ندارید.</div>'; }
    else if (S.view === "inbox") renderInbox();
    else if (S.view === "master") { if(can("master")) renderMaster(); else document.getElementById("view").innerHTML='<div class="warn">⛔ فقط مدیر سیستم</div>'; }
    else if (S.view === "org") renderOrg();
    else if (S.view === "companies") renderCompanies();
    else if (S.view === "reports") renderReports();
    else if (S.view === "settings") { if(can("settings")) renderSettings(); else document.getElementById("view").innerHTML='<div class="warn">⛔ فقط مدیر سیستم</div>'; }
    else if (S.view === "users") renderUsers();
  }
  function renderHolding(){
    var rows=holdingAggregate(); var totalKpis=S.kpis.filter(isActive).length;
    var html='<div class="grid g-4">'
      + stat("تعداد شرکت‌ها", fa(S.companies.length), "هلدینگ نیکان", "navy", "🏢")
      + stat("مجموع شاخص‌های فعال", fa(totalKpis), "همه شرکت‌ها", "green", "📊")
      + stat("میانگین هلدینگ", pct(rows.filter(function(r){return r.meas;}).length? rows.reduce(function(s,r){return s+(r.meas?r.avg:0);},0)/rows.filter(function(r){return r.meas;}).length :0), "میانگین شرکت‌ها", "blue", "🎯")
      + stat("شرکت برتر", rows[0]&&rows[0].meas? esc(rows[0].name):"—", rows[0]&&rows[0].meas? pct(rows[0].avg):"—", "yellow", "🏆")
      + '</div>'
      + '<div class="section-title">🏆 رتبه‌بندی شرکت‌ها (بر اساس میانگین تحقق)</div>'
      + '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>رتبه</th><th>شرکت</th><th>کد</th><th>تعداد شاخص</th><th>سبز/زرد/قرمز</th><th>میانگین</th><th></th></tr></thead><tbody>'
      + rows.map(function(r,i){ var tone=r.avg>=S.thGreen? C.green : r.avg>=S.thYellow? C.yellow : C.red; return "<tr><td><b>"+fa(i+1)+"</b></td><td><b>"+esc(r.name)+'</b></td><td class="mono">'+esc(r.code)+"</td><td>"+fa(r.total)+"</td><td><span class='badge green'>"+fa(r.counts.green)+"</span> <span class='badge yellow'>"+fa(r.counts.yellow)+"</span> <span class='badge red'>"+fa(r.counts.red)+"</span></td><td><b style='color:"+tone+"'>"+(r.meas?pct(r.avg):"—")+"</b></td><td><a onclick=\"KPI.setCurrentCompany("+r.id+"); KPI.setView('dashboard')\">مشاهده شرکت ›</a></td></tr>"; }).join("") + '</tbody></table></div></div>'
      + '<div class="hint-box">داشبورد هلدینگ تجمیعی است — برای جزئیات هر شرکت، شرکت را از نوار بالا انتخاب کنید یا روی «مشاهده شرکت» بزنید. داده هر شرکت کاملاً مستقل است.</div>';
    document.getElementById("view").innerHTML=html;
  }
  function renderCompanies(){
    var rows=holdingAggregate();
    var html='<div class="toolbar"><div class="spacer"></div><button class="btn btn-primary" onclick="KPI.openCompanyForm(null)">+ شرکت جدید</button></div>'
      + '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>کد</th><th>نام شرکت</th><th>وضعیت</th><th>شاخص‌ها</th><th>میانگین تحقق</th><th>عملیات</th></tr></thead><tbody>'
      + rows.map(function(r){ var comp=getCompany(r.id); return "<tr><td class='mono'>"+esc(comp.code)+"</td><td><b>"+esc(comp.name)+"</b></td><td>"+(comp.is_active!==false?'<span class="badge green">فعال</span>':'<span class="badge gray">غیرفعال</span>')+"</td><td>"+fa(r.total)+"</td><td>"+pct(r.avg)+"</td><td style='display:flex;gap:6px'><button class='btn btn-sm btn-ghost' onclick=\"KPI.openCompanyForm("+r.id+")\">ویرایش</button><button class='btn btn-sm btn-primary' onclick=\"KPI.setCurrentCompany("+r.id+")\">ورود به شرکت</button></td></tr>"; }).join("") + '</tbody></table></div></div>'
      + '<div class="hint-box">۸ شرکت اولیه هلدینگ از قبل ایجاد شده است. شرکت جدید بدون تغییر کد قابل افزودن است. داده شاخص‌های فعلی متعلق به <b>NIP-MAIN (سایت اصلی)</b> است و سایر شرکت‌ها خالی هستند — از «مدیریت شاخص‌ها» برای هر شرکت شاخص‌های اختصاصی بسازید.</div>';
    document.getElementById("view").innerHTML=html;
  }
  function openCompanyForm(id){
    var c=id? getCompany(id): null; var f=c? Object.assign({},c): {code:"", name:"", color:"#12315b", is_active:true};
    var html='<div class="modal-ov" onclick="if(event.target.classList.contains(\'modal-ov\'))KPI.closeModal()"><div class="modal"><div class="mh"><h3>'+(id?"ویرایش شرکت":"شرکت جدید")+'</h3><button class="x" onclick="KPI.closeModal()">×</button></div><div class="mb"><div class="form-grid">'
      + fld("کد شرکت (انگلیسی)", '<input id="cf_code" value="'+esc(f.code)+'" '+(id?'disabled':'')+'>')
      + fld("نام شرکت", '<input id="cf_name" value="'+esc(f.name)+'">')
      + fld("رنگ", '<input id="cf_color" type="color" value="'+esc(f.color||"#12315b")+'">')
      + fld("وضعیت", '<select id="cf_active"><option value="1"'+(f.is_active!==false?" selected":"")+'>فعال</option><option value="0"'+(f.is_active===false?" selected":"")+'>غیرفعال</option></select>')
      + '</div></div><div class="mf"><button class="btn btn-primary" onclick="KPI.saveCompany('+(id||"null")+')">ذخیره</button><button class="btn btn-ghost" onclick="KPI.closeModal()">انصراف</button></div></div></div>';
    document.getElementById("modal-root").innerHTML=html;
  }
  function saveCompany(id){
    var code=(document.getElementById("cf_code")||{}).value||""; code=code.trim().toUpperCase();
    var name=(document.getElementById("cf_name")||{}).value||""; name=name.trim();
    var color=(document.getElementById("cf_color")||{}).value||"#12315b";
    var active=(document.getElementById("cf_active")||{}).value==="1";
    if(!code || !name){ alert("کد و نام الزامی است"); return; }
    if(id){
      var c=getCompany(id); c.code=code; c.name=name; c.color=color; c.is_active=active;
    } else {
      if(S.companies.some(function(x){return x.code===code;})){ alert("کد تکراری است"); return; }
      var nid=Math.max.apply(null, S.companies.map(function(x){return x.id}))+1; S.companies.push({id:nid, code:code, name:name, color:color, is_active:active});
    }
    save(); closeModal(); renderCompanies();
  }

  /* ---------------- boot ---------------- */
  window.KPI = {
    strategyFilterKpis: strategyFilterKpis,
    strategyAddSamples: strategyAddSamples,
    strategyEditGoal: strategyEditGoal, strategyEditLink: strategyEditLink, strategyRemoveLink: strategyRemoveLink, strategyEditAction: strategyEditAction, strategyStartAction: strategyStartAction, strategyUpdateAction: strategyUpdateAction, strategyArchive: strategyArchive, strategySelect: strategySelect, strategySetPeriod: strategySetPeriod,
    setView: setView, setYear: setYear, setEntryMonth: setEntryMonth, setOrg: setOrg, setTh: setTh,
    renderKpis: renderKpis, clearProcFilter: clearProcFilter, gotoProcess: gotoProcess,
    runDetailAnalysis: runDetailAnalysis, openDetail: openDetail, closeModal: closeModal, onActual: onActual, renderEntry: renderEntry,
    openKpiForm: openKpiForm, saveKpi: saveKpi, deleteKpi: deleteKpi, toggleActive: toggleActive,
    renderOrg: renderOrg, exportXLSX: exportXLSX, exportCSV: exportCSV, printReport: printReport, printActiveKpis: printActiveKpis, printAllKpis: printAllKpis, printInactiveKpis: printInactiveKpis, printKpiList: printKpiList, exportKpiList: exportKpiList, exportActiveKpis: exportActiveKpis, exportAllKpis: exportAllKpis, exportInactiveKpis: exportInactiveKpis, exportActiveKpisCSV: exportActiveKpisCSV, exportAllKpisCSV: exportAllKpisCSV, exportInactiveKpisCSV: exportInactiveKpisCSV, runNoDataReport: runNoDataReport, printNoDataReport: printNoDataReport, exportNoDataXLSX: exportNoDataXLSX,
    backup: backup, restore: restore, loadSample: loadSample, clearData: clearData, installApp: installApp,
    advanceWf: advanceWf, setWfK: setWfK, resetWf: resetWf,
    attemptLogin: attemptLogin, logout: doLogout, openAdminRecovery: openAdminRecovery, doAdminRecovery: doAdminRecovery, openUserForm: openUserForm, saveUser: saveUser, deleteUser: deleteUser, renderUsers: renderUsers,
    onUserCompanyChange: onUserCompanyChange, onUserRoleChange: onUserRoleChange, toggleUserPerm: toggleUserPerm, setAllPerms: setAllPerms, resetPerms: resetPerms,
    toggleMasterGroup: toggleMasterGroup, toggleAllMaster: toggleAllMaster,
    setCurrentCompany: setCurrentCompany, renderHolding: renderHolding, renderCompanies: renderCompanies, openCompanyForm: openCompanyForm, saveCompany: saveCompany,
    openProcessEdit: openProcessEdit, renameProcess: renameProcess,
    runRangeReport: runRangeReport, setOnlyApproved: setOnlyApproved, attemptSetup: attemptSetup, attemptForceChange: attemptForceChange, exportRangeCSV: exportRangeCSV, exportRangeXLSX: exportRangeXLSX, printRangeReport: printRangeReport
  };

  function installApp() {
    if (window.__defPrompt) { try { window.__defPrompt.prompt(); if (window.__defPrompt.userChoice && window.__defPrompt.userChoice.then) window.__defPrompt.userChoice.then(function () {}); } catch (e) {} window.__defPrompt = null; }
    else { alert("برای نصب برنامه روی دستگاه، پوشهٔ برنامه را روی یک سرور داخلی یا میزبان استاتیک قرار دهید، سپس از گزینهٔ نصب مرورگر (معمولاً بالای نوار آدرس یا منوی ⋮) استفاده کنید."); }
  }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__defPrompt = e; });

  S = load();
  if (!S.entryPeriod) S.entryPeriod = { year: S.currentYear, month: 5 };
  if (!S.kpis) S.kpis = []; // بدون شاخص پیش‌فرض — کاربر خودش می‌سازد
  else S.kpis.forEach(function(k){ if(k.active===undefined) k.active=true; });
  if(!S.users || !S.users.length){ S.users = defaultUsers(); S.nextUserId=2; S.session=null; save(); }
  if(!S.nextUserId) S.nextUserId = (Math.max.apply(null, S.users.map(function(u){return u.id}))||0)+1;
  if(S.session===undefined) S.session=null;
  if (S._filterProc === undefined) S._filterProc = "";
  if (!S.view) S.view = "dashboard";
  // ensure view is allowed for current user
  var _cu = (S.session && S.users.find(function(u){return u.id===S.session.userId})) || null;
  if(_cu){ var _perms=ROLE_PERMS[_cu.role_code]||[]; if(_perms.indexOf(S.view)<0 && !(S.view==="strategy"&&strategyCanView())) S.view=_perms[0]||"dashboard"; }

  function boot() { document.getElementById("yearBar").innerHTML = yearSelect(); render(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
